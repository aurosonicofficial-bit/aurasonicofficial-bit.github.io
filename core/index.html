    var k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(V.t), iterations:V.i, hash:"SHA-256"}, k0, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var d = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(V.n)}, k, b(V.c));
    return new TextDecoder().decode(d);
  }
  function yaz(h){ document.open(); document.write(h); document.close(); }
  var f = document.getElementById("f"), s = document.getElementById("s"), h = document.getElementById("h"), anahtar = "asc_onizleme";
  var eski = null; try { eski = sessionStorage.getItem(anahtar); } catch(e){}
  if (eski) ac(eski).then(yaz).catch(function(){ try { sessionStorage.removeItem(anahtar); } catch(e){} });
  f.addEventListener("submit", function(e){
    e.preventDefault(); h.textContent = "";
    var deger = s.value.trim().toUpperCase();
    ac(deger).then(function(html){ try { sessionStorage.setItem(anahtar, deger); } catch(e){} yaz(html); })
      .catch(function(){ h.textContent = "Şifre eşleşmedi. Büyük-küçük harf fark etmez; tireleri de yazın."; s.select(); });
  });
})();
