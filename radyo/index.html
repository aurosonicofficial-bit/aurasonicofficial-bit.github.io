<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Sonic Radio — Live 24/7</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(circle at 50% 0%,#16131a,#0a0a0c 70%);color:#e9e6ef;
    font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;text-align:center;}
  .logo{width:120px;height:auto;margin-bottom:18px;filter:drop-shadow(0 6px 20px rgba(0,0,0,.6))}
  h1{font-size:26px;letter-spacing:3px;font-weight:800;margin-bottom:6px}
  .on-air{display:inline-flex;align-items:center;gap:8px;color:#fff;background:#c0392b;
    font-weight:700;font-size:13px;letter-spacing:1.5px;padding:6px 14px;border-radius:20px;margin-bottom:18px}
  .dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.25}}
  .sub{color:#b8b2c4;font-size:14px;letter-spacing:1px;margin-bottom:22px}
  .player{width:100%;max-width:880px;position:relative;padding-bottom:56.25%;height:0;
    border-radius:16px;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.6)}
  .player iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
  .back{margin-top:24px}
  .back a{color:#d4af37;text-decoration:none;font-weight:600;letter-spacing:1px;font-size:14px}
  .back a:hover{text-decoration:underline}
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Aura Sonic" onerror="this.style.display='none'">
  <h1>AURA SONIC RADIO</h1>
  <div class="on-air"><span class="dot"></span> ON AIR · 24/7</div>
  <div class="sub">Global Hits · Rock · Pop · Latin · Dance — Music Never Sleeps</div>
  <div class="player">
    <iframe src="https://www.youtube.com/embed/live_stream?channel=UCS59J8baS5L0ZgsQilf6nAA"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen
      title="Aura Sonic Radio — Live"></iframe>
  </div>
  <div class="back"><a href="/">← aurasonicofficial.com</a></div>
</body>
