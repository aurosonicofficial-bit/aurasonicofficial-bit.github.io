<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#C9A84C;--gold2:#E8C96A}
html,body{height:100%}
body{font-family:'Montserrat',sans-serif;background:#0a0a0a;color:#fff;overflow:hidden;height:100vh}
a{color:inherit;text-decoration:none}

/* SLIDESHOW */
.stage{position:fixed;inset:0;background:#0a0a0a}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.slide.active{opacity:1}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;filter:grayscale(1) contrast(1.05) brightness(.95)}
.slide.active img{animation:kb 8s ease-out forwards}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.1)}}
/* güçlü alt gradyan — yazı asla kaybolmaz */
.slide::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.55) 0,transparent 20%,transparent 45%,rgba(10,10,10,.85) 80%,rgba(10,10,10,.97) 100%)}

/* ARTIST NAME — footer'ın üstünde, güvenli alanda */
.slide-name{position:absolute;left:0;right:0;bottom:128px;text-align:center;z-index:5;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(36px,5.5vw,82px);letter-spacing:1px;color:var(--gold2);text-shadow:0 3px 30px rgba(0,0,0,.85);opacity:0;transform:translateY(16px);transition:.9s .4s}
.slide.active .slide-name{opacity:1;transform:translateY(0)}
.slide-genre{position:absolute;left:0;right:0;bottom:104px;text-align:center;z-index:5;font-size:11px;letter-spacing:5px;text-transform:uppercase;color:rgba(255,255,255,.78);opacity:0;transition:.9s .6s}
.slide.active .slide-genre{opacity:1}

/* TOP LOGO */
.topbar{position:fixed;top:10px;left:78px;z-index:50;display:flex;align-items:center;pointer-events:none;transition:transform .45s cubic-bezier(.4,0,.2,1),opacity .35s ease}
.topbar img{height:128px;filter:drop-shadow(0 4px 20px rgba(0,0,0,.75))}
/* menü açılınca logo sola çekilir, kapanınca yerine döner */
body.menu-open .topbar{transform:translateX(-150%);opacity:0}

/* MENU BUTTON (gold) */
.menu-btn{position:fixed;top:0;left:0;z-index:60;width:60px;height:60px;background:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:.25s}
.menu-btn:hover{background:var(--gold2)}
.menu-btn span{width:24px;height:2px;background:#0a0a0a;transition:.3s}

/* TOP-RIGHT (dil) */
.lang-btn{position:fixed;top:0;right:0;z-index:30;height:60px;padding:0 24px;background:rgba(18,18,18,.9);display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:2px;cursor:pointer}
.lang-btn span{opacity:.5;transition:.2s}
.lang-btn span.on{opacity:1;color:var(--gold)}
.lang-btn span:hover{opacity:1}

/* ARROWS */
.nav-arrow{position:fixed;right:0;z-index:25;width:50px;height:52px;background:rgba(15,15,15,.8);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:22px;transition:.25s;border:none}
.nav-arrow:hover{background:var(--gold);color:#0a0a0a}
.nav-prev{top:calc(50% - 52px)}
.nav-next{top:50%}

/* DOTS */
.dots{position:fixed;bottom:70px;left:0;right:0;z-index:15;display:flex;justify-content:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:.3s}
.dot.on{background:var(--gold);width:22px;border-radius:3px}

/* FOOTER */
.foot{position:fixed;bottom:0;left:0;right:0;z-index:20;height:46px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:11px;color:rgba(255,255,255,.55)}
.foot-social{display:flex;gap:20px;font-size:15px}
.foot-social a{opacity:.7;transition:.2s}
.foot-social a:hover{opacity:1;color:var(--gold)}
.foot-legal{display:flex;gap:14px}
.foot-legal a:hover{color:var(--gold)}

/* SOL AÇILIR MENÜ (UMG tarzı) */
.drawer{position:fixed;top:0;left:0;bottom:0;width:340px;max-width:84vw;z-index:55;background:#0d0d0d;border-right:1px solid rgba(201,168,76,.18);transform:translateX(-100%);transition:.4s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding:90px 0 30px}
.drawer.open{transform:translateX(0)}
.drawer-overlay{position:fixed;inset:0;z-index:54;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.4s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer nav{flex:1;display:flex;flex-direction:column}
.drawer nav a{padding:15px 36px;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.82);border-left:3px solid transparent;transition:.22s}
.drawer nav a:hover{color:var(--gold);border-left-color:var(--gold);background:rgba(201,168,76,.05)}
.drawer-foot{padding:24px 36px 0;border-top:1px solid rgba(255,255,255,.07);margin-top:18px}
.drawer-foot .badge{display:inline-block;border:1px solid var(--gold);color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:2px;padding:10px 16px;border-radius:4px;line-height:1.3;text-align:center}
.drawer-foot .c{font-size:11px;color:rgba(255,255,255,.45);margin-top:16px;line-height:1.7}

@media(max-width:640px){.foot-legal{display:none}.topbar img{height:40px}.slide-name{bottom:118px}.slide-genre{bottom:98px}}
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="topbar">
  <img src="aura-logo-gold.png" alt="AURA SONIC OFFICIAL" onerror="this.src='aurasonicofficial-logo.png'">
</div>

<!-- MENU BUTTON -->

<!-- DİL -->
<div class="lang-btn">
  <span class="on" data-lang="tr" onclick="setLang('tr')">TR</span>
  <span data-lang="en" onclick="setLang('en')">EN</span>

  </div>
</div>

<!-- SOL MENÜ -->
<div class="drawer-overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <nav>
    <a href="index.html" data-i18n="m_home">Ana Sayfa</a><a href="magaza.html" data-i18n="m_shop">Mağaza</a>
    <a href="hakkimizda.html" data-i18n="m_about">Hakkımızda</a>
    <a href="sanatcilar.html" data-i18n="m_artists">Sanatçılarımız</a>
    <a href="vizyon.html" data-i18n="m_vision">Vizyonumuz</a>
    <a href="radyo.html" data-i18n="m_radio">Radyo</a><a href="sanatcilar-icin.html" data-i18n="m_forartists">Sanatçılar İçin</a>
    <a href="telif.html" data-i18n="m_rights">Telif</a><a href="iletisim.html" data-i18n="m_contact">İletişim</a>
  </nav>
  <div class="drawer-foot">
    <div class="badge" data-i18n="badge">BAĞIMSIZ<br>MÜZİK ŞİRKETİ</div>
    <div class="c">AURA SONIC OFFICIAL GROUP<br>London · İzmir</div>
  </div>
</aside>

<script>
const ARTISTS = [
  {n:"Aşkın Öztürk", g:{tr:"Emotional Pop-Rock · Söz-Müzik",en:"Emotional Pop-Rock · Singer-Songwriter"}, img:"askin-ozturk", pos:"57% 26%"},
  {n:"Kael Voss", g:{tr:"Cinematic Story Rock",en:"Cinematic Story Rock"}, img:"kael-voss", pos:"50% 30%"},
  {n:"Vael Cross", g:{tr:"Dark Cinematic Rock",en:"Dark Cinematic Rock"}, img:"vael-cross", pos:"48% 26%"},
  {n:"Maria Mel", g:{tr:"Emotional Soul-Pop",en:"Emotional Soul-Pop"}, img:"maria-mel", pos:"48% 16%"},
  {n:"Lyra Sage", g:{tr:"Spanish Latin Pop",en:"Spanish Latin Pop"}, img:"lyra-sage", pos:"58% 16%"},
  {n:"Lara", g:{tr:"Global Summer Pop",en:"Global Summer Pop"}, img:"lara", pos:"47% 20%"},
  {n:"Jaxen Moon", g:{tr:"Americana · Folk-Rock",en:"Americana · Folk-Rock"}, img:"jaxen-moon", pos:"48% 30%"},
  {n:"İrem Sezin", g:{tr:"Dramatic Female Rock",en:"Dramatic Female Rock"}, img:"irem-sezin", pos:"47% 18%"},
  {n:"Naxo Veyra", g:{tr:"Latin Urbano · Reggaeton",en:"Latin Urbano · Reggaeton"}, img:"naxo-veyra", pos:"50% 16%"},
  {n:"Chris Marlo", g:{tr:"Modern Dance Pop",en:"Modern Dance Pop"}, img:"chris-marlo", pos:"50% 20%"},
  {n:"Neil Daren", g:{tr:"Modern Arena Rock",en:"Modern Arena Rock"}, img:"neil-daren", pos:"50% 0%"},
  {n:"Chronos", g:{tr:"Rock · Grup",en:"Rock · Band"}, img:"chronos", pos:"center 40%"},
  {n:"Esin Banu", g:{tr:"Prodüktör Sanatçı",en:"Producer & Artist"}, img:"esin-banu", pos:"50% 32%"}
];

const I18N = {
  tr:{wm:"Aura Sonic Official",copyright:"© 2026 AURA SONIC OFFICIAL GROUP. Tüm hakları saklıdır.",about:"Hakkımızda",contact:"İletişim",m_shop:"Mağaza",m_home:"Ana Sayfa",m_about:"Hakkımızda",m_artists:"Sanatçılarımız",m_vision:"Vizyonumuz",m_radio:"Radyo",m_forartists:"Sanatçılar İçin",m_rights:"Telif",m_contact:"İletişim",badge:"BAĞIMSIZ<br>MÜZİK ŞİRKETİ"},
  en:{wm:"Aura Sonic Official",copyright:"© 2026 AURA SONIC OFFICIAL GROUP. All rights reserved.",about:"About",contact:"Contact",m_shop:"Store",m_home:"Home",m_about:"About",m_artists:"Our Artists",m_vision:"Our Vision",m_radio:"Radio",m_forartists:"For Artists",m_rights:"Copyright",m_contact:"Contact",badge:"INDEPENDENT<br>MUSIC COMPANY"}
};
let lang = localStorage.getItem('asLang') || 'tr';

function setLang(l){
  lang = l; localStorage.setItem('asLang',l);
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ if(I18N[l][el.dataset.i18n]) el.innerHTML = I18N[l][el.dataset.i18n]; });
  document.querySelectorAll('.lang-btn span').forEach(s=>s.classList.toggle('on', s.dataset.lang===l));
  document.querySelectorAll('.slide-genre').forEach((el,i)=>{ el.textContent = ARTISTS[i].g[l]; });
}

const stage = document.getElementById('stage'), dots = document.getElementById('dots');
ARTISTS.forEach((a,i)=>{
  const s = document.createElement('div');
  s.className = 'slide' + (i===0?' active':'');
  s.innerHTML = `<img src="images/artists/${a.img}.jpg?v=4" alt="${a.n}" loading="${i<2?'eager':'lazy'}" style="object-position:${a.pos}">
    <a class="slide-name" href="artist.html?a=${a.img}" style="display:block;text-decoration:none">${a.n}</a>
    <div class="slide-genre">${a.g[lang]}</div>`;
  stage.appendChild(s);
  const d = document.createElement('div');
  d.className = 'dot' + (i===0?' on':''); d.onclick=()=>show(i); dots.appendChild(d);
});

let cur=0,timer;
const slides=document.querySelectorAll('.slide'), allDots=document.querySelectorAll('.dot');
function show(i){slides[cur].classList.remove('active');allDots[cur].classList.remove('on');cur=(i+ARTISTS.length)%ARTISTS.length;slides[cur].classList.add('active');allDots[cur].classList.add('on');restart();}
function go(d){show(cur+d);}
function restart(){clearInterval(timer);timer=setInterval(()=>go(1),6000);}
restart();
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});

// menu
const drawer=document.getElementById('drawer'),overlay=document.getElementById('overlay');
document.getElementById('menuBtn').onclick=()=>{drawer.classList.add('open');overlay.classList.add('open');document.body.classList.add('menu-open')};
overlay.onclick=()=>{drawer.classList.remove('open');overlay.classList.remove('open');document.body.classList.remove('menu-open')};

setLang(lang);
</script>
</body>
